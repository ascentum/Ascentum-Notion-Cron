services:
  notion-cron:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: notion-cron:oracle
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-./notion-cron.env}
    environment:
      NODE_ENV: production
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      PORT: "3000"
      SQLITE_DB_PATH: /app/data/automation.sqlite
    volumes:
      - notion-cron-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/healthz').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      notion-cron:
        condition: service_healthy
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  notion-cron-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/opt/notion-cron/data}
  caddy-data:
  caddy-config:
