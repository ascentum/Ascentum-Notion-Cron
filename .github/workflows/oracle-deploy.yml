name: Oracle Deploy

# notion-cron 은 Oracle Cloud VM `archy-ops-cron` 에서 Docker Compose 로 상시 구동된다.
#
# 그 호스트에는 외부에서 들어갈 수 없다. SSH 22번이 NSG 에서 사설 IP 두 개로만
# 열려 있고, NSG 에 공인 IP 를 추가해도 ufw 가 따로 막는다. Oracle Cloud Agent 의
# Run Command 플러그인은 이 에이전트 버전에 아예 없고, Bastion 은 세션 인증까지는
# 통과하지만 대상 연결이 끊긴다. 같은 서브넷의 self-hosted 러너를 경유하는
# 이 워크플로가 유일하게 동작하는 경로다. (Archy_V2 의 oracle-ops-agent-deploy 와 동일)
#
# ops-agent 와 달리 여기는 아티팩트 복사가 아니라 호스트의 git 체크아웃을 갱신한다.
# 이미지 빌드도 호스트에서 한다. 1 GB VM 이라 빌드가 무거우므로 한 번에 하나만 돈다.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy, or DISCOVER to only inspect the host
        required: true
        default: DISCOVER
      target_ref:
        description: Ref to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: oracle-notion-cron-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy notion-cron to Oracle host
    runs-on: [self-hosted, archy-vercel]
    timeout-minutes: 20

    env:
      API_HOST: ${{ secrets.API_HOST }}
      API_USER: ${{ secrets.API_USER }}
      API_SSH_PORT: ${{ secrets.API_SSH_PORT }}
      # 호스트의 체크아웃 경로. vars 로 덮어쓸 수 있고, 없으면 DISCOVER 가 찾아낸 기본값.
      REPO_DIR: ${{ vars.NOTION_CRON_REPO_DIR || '/opt/notion-cron/app' }}
      COMPOSE_FILE: ops/oracle/docker-compose.yml
      ENV_FILE: ops/oracle/notion-cron.env
      HEALTH_URL: https://notion-cron.168.110.123.188.sslip.io/healthz

    steps:
      - name: Validate inputs
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "DEPLOY" ] && [ "${CONFIRM}" != "DISCOVER" ]; then
            echo "Refusing: confirm must be DEPLOY or DISCOVER."
            exit 1
          fi
          if [[ ! "${TARGET_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Refusing: target_ref contains unsupported characters."
            exit 1
          fi

      - name: Configure SSH key
        shell: bash
        env:
          API_SSH_KEY: ${{ secrets.API_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${API_HOST}"; test -n "${API_USER}"
          test -n "${API_SSH_PORT}"; test -n "${API_SSH_KEY}"
          mkdir -p "${HOME}/.ssh"; chmod 700 "${HOME}/.ssh"
          umask 077
          printf '%s\n' "${API_SSH_KEY}" > "${HOME}/.ssh/notion_cron_deploy_key"
          ssh-keyscan -p "${API_SSH_PORT}" "${API_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/notion_cron_deploy_key" "${HOME}/.ssh/known_hosts"

      - name: Inspect host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/notion_cron_deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "${API_SSH_PORT}" "${API_USER}@${API_HOST}" \
            "REPO_DIR='${REPO_DIR}' COMPOSE_FILE='${COMPOSE_FILE}' ENV_FILE='${ENV_FILE}' bash -se" <<'REMOTE'
          set -uo pipefail
          echo "HOSTNAME=$(hostname)"
          echo "DOCKER=$(docker version --format '{{.Server.Version}}' 2>/dev/null || echo '<no access>')"
          echo "REPO_DIR=${REPO_DIR}"
          if [ -d "${REPO_DIR}/.git" ]; then
            echo "REPO_FOUND=yes"
            echo "REPO_COMMIT=$(git -C "${REPO_DIR}" rev-parse --short HEAD)"
            echo "REPO_BRANCH=$(git -C "${REPO_DIR}" rev-parse --abbrev-ref HEAD)"
            echo "REPO_DIRTY=$(test -n "$(git -C "${REPO_DIR}" status --porcelain)" && echo yes || echo no)"
            echo "ENV_FILE_PRESENT=$([ -f "${REPO_DIR}/${ENV_FILE}" ] && echo yes || echo no)"
          else
            echo "REPO_FOUND=no"
            # 경로를 모를 때 후보를 찾아준다. vars.NOTION_CRON_REPO_DIR 로 고정하면 된다.
            echo "CANDIDATES<<EOF"
            find / -xdev -maxdepth 5 -type d -name 'Ascentum-Notion-Cron' 2>/dev/null
            find / -xdev -maxdepth 5 -type f -name 'notion-cron.env' 2>/dev/null
            echo "EOF"
          fi
          echo "CONTAINERS<<EOF"
          docker ps --format '{{.Names}}\t{{.Status}}' 2>/dev/null
          echo "EOF"
          REMOTE

      - name: Deploy
        if: ${{ inputs.confirm == 'DEPLOY' }}
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/notion_cron_deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "${API_SSH_PORT}" "${API_USER}@${API_HOST}" \
            "REPO_DIR='${REPO_DIR}' COMPOSE_FILE='${COMPOSE_FILE}' ENV_FILE='${ENV_FILE}' TARGET_REF='${TARGET_REF}' HEALTH_URL='${HEALTH_URL}' bash -se" <<'REMOTE'
          set -euo pipefail

          test -d "${REPO_DIR}/.git" || { echo "No git checkout at ${REPO_DIR}. Run DISCOVER first."; exit 1; }
          test -f "${REPO_DIR}/${ENV_FILE}" || { echo "Missing ${ENV_FILE} on host."; exit 1; }

          cd "${REPO_DIR}"
          PREV="$(git rev-parse HEAD)"
          echo "PREV_COMMIT=${PREV}"

          # notion-cron.env 는 gitignore 대상이라 여기 잡히지 않는다. 그 외에 손댄 게
          # 있다면 호스트에서 직접 고친 흔적이므로 덮어쓰지 않고 멈춘다.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing: host checkout has uncommitted changes."
            git status --porcelain
            exit 1
          fi

          git fetch --prune origin
          git checkout -B deploy "origin/${TARGET_REF}"
          NEW="$(git rev-parse HEAD)"
          echo "NEW_COMMIT=${NEW}"

          compose() {
            docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" "$@"
          }

          echo "--- building and starting ---"
          compose up -d --build

          echo "--- waiting for health ---"
          ok=no
          for i in $(seq 1 30); do
            sleep 5
            code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 "${HEALTH_URL}" || true)"
            echo "  attempt ${i}: ${code:-no-response}"
            if [ "${code}" = "200" ]; then ok=yes; break; fi
          done

          if [ "${ok}" != "yes" ]; then
            echo "!!! health check failed — rolling back to ${PREV}"
            git checkout -B deploy "${PREV}"
            compose up -d --build
            for i in $(seq 1 30); do
              sleep 5
              code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 "${HEALTH_URL}" || true)"
              if [ "${code}" = "200" ]; then echo "rollback healthy"; break; fi
            done
            exit 1
          fi

          echo "DEPLOYED=${NEW}"
          curl -fsS --max-time 10 "${HEALTH_URL}"
          echo
          compose ps
          REMOTE

      - name: Clean up key
        if: always()
        shell: bash
        run: rm -f "${HOME}/.ssh/notion_cron_deploy_key"
