name: Oracle Deploy

# notion-cron 은 Oracle Cloud VM `archy-ops-cron` 에서 Docker Compose 로 상시 구동된다.
#
# 그 호스트에는 외부에서 들어갈 수 없다. SSH 22번이 NSG 에서 사설 IP 두 개로만
# 열려 있고, NSG 에 공인 IP 를 추가해도 ufw 가 따로 막는다. Oracle Cloud Agent 의
# Run Command 플러그인은 이 에이전트 버전에 없고, Bastion 은 세션 인증까지는
# 통과하지만 대상 연결이 끊긴다. 같은 서브넷의 self-hosted 러너를 경유하는
# 이 워크플로가 유일하게 동작하는 경로다.
#
# `/opt/notion-cron/app` 은 git 체크아웃이 아니라 아티팩트 디렉터리다. 그래서
# git pull 이 아니라 tarball 을 받아 통째로 교체한다. 레포가 public 이라
# 호스트가 직접 받을 수 있고 별도 자격증명이 필요 없다.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy, or DISCOVER to only inspect the host
        required: true
        default: DISCOVER
      target_ref:
        description: Branch to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: oracle-notion-cron-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy notion-cron to Oracle host
    runs-on: [self-hosted, archy-vercel]
    timeout-minutes: 25

    env:
      API_HOST: ${{ secrets.API_HOST }}
      API_USER: ${{ secrets.API_USER }}
      API_SSH_PORT: ${{ secrets.API_SSH_PORT }}
      APP_DIR: ${{ vars.NOTION_CRON_APP_DIR || '/opt/notion-cron/app' }}
      HEALTH_URL: https://notion-cron.168.110.123.188.sslip.io/healthz

    steps:
      - name: Validate inputs
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "DEPLOY" ] && [ "${CONFIRM}" != "DISCOVER" ]; then
            echo "Refusing: confirm must be DEPLOY or DISCOVER."
            exit 1
          fi
          if [[ ! "${TARGET_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Refusing: target_ref contains unsupported characters."
            exit 1
          fi

      - name: Configure SSH key
        shell: bash
        env:
          API_SSH_KEY: ${{ secrets.API_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${API_HOST}"; test -n "${API_USER}"
          test -n "${API_SSH_PORT}"; test -n "${API_SSH_KEY}"
          mkdir -p "${HOME}/.ssh"; chmod 700 "${HOME}/.ssh"
          umask 077
          printf '%s\n' "${API_SSH_KEY}" > "${HOME}/.ssh/notion_cron_deploy_key"
          ssh-keyscan -p "${API_SSH_PORT}" "${API_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/notion_cron_deploy_key" "${HOME}/.ssh/known_hosts"

      - name: Inspect host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/notion_cron_deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "${API_SSH_PORT}" "${API_USER}@${API_HOST}" \
            "APP='${APP_DIR}' bash -se" <<'REMOTE'
          # ssh 가 bash -se 로 돌리므로 errexit 가 켜져 있다. 조회는 죽지 않게 둔다.
          set +e
          echo "HOSTNAME=$(hostname)"
          echo "DOCKER=$(docker version --format '{{.Server.Version}}' 2>/dev/null || echo '<no access>')"
          echo "APP_WRITABLE=$([ -w "$APP" ] && echo yes || echo no)"
          echo "ENV_PRESENT=$([ -f "$APP/ops/oracle/notion-cron.env" ] && echo yes || echo no)"
          echo "COMPOSE_LABELS<<EOF"
          for c in $(docker ps --format '{{.Names}}' 2>/dev/null); do
            echo "$c  config_files=$(docker inspect "$c" --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}' 2>/dev/null)"
          done
          echo "EOF"
          echo "CONTAINERS<<EOF"
          docker ps --format '{{.Names}}  {{.Status}}' 2>/dev/null
          echo "EOF"
          exit 0
          REMOTE

      - name: Deploy
        if: ${{ inputs.confirm == 'DEPLOY' }}
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/notion_cron_deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "${API_SSH_PORT}" "${API_USER}@${API_HOST}" \
            "APP='${APP_DIR}' REF='${TARGET_REF}' HEALTH_URL='${HEALTH_URL}' bash -se" <<'REMOTE'
          set -euo pipefail

          ENV_REL=ops/oracle/notion-cron.env
          TS="$(date +%Y%m%d%H%M%S)"
          BACKUP="${HOME}/notion-cron-backups/${TS}"
          STAGE="$(mktemp -d "/tmp/notion-cron-stage-${TS}-XXXXXX")"
          trap 'rm -rf "${STAGE}" /tmp/notion-cron-src.tar.gz' EXIT

          test -d "${APP}" || { echo "Missing ${APP}"; exit 1; }
          test -f "${APP}/${ENV_REL}" || { echo "Missing ${APP}/${ENV_REL}"; exit 1; }

          # 이 스택은 compose 파일 두 개로 떠 있다(archy-proxy override 포함).
          # 하나만 넘기면 caddy 가 override 없이 재생성되어 프록시가 깨진다.
          # caddy 컨테이너 라벨의 목록을 그대로 재사용한다.
          CF_LIST="$(docker inspect oracle-caddy-1 --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}' 2>/dev/null || true)"
          if [ -z "${CF_LIST}" ]; then
            CF_LIST="${APP}/ops/oracle/docker-compose.yml"
          fi
          COMPOSE_ARGS=()
          OLD_IFS="${IFS}"; IFS=','
          for f in ${CF_LIST}; do
            IFS="${OLD_IFS}"
            [ -n "$f" ] && COMPOSE_ARGS+=(-f "$f")
            IFS=','
          done
          IFS="${OLD_IFS}"
          echo "COMPOSE_FILES=${CF_LIST}"

          compose() {
            docker compose -p oracle --env-file "${APP}/${ENV_REL}" "${COMPOSE_ARGS[@]}" "$@"
          }

          echo "--- fetching ${REF} ---"
          curl -fsSL "https://github.com/ascentum/Ascentum-Notion-Cron/archive/refs/heads/${REF}.tar.gz" \
            -o /tmp/notion-cron-src.tar.gz
          tar -xzf /tmp/notion-cron-src.tar.gz -C "${STAGE}" --strip-components=1
          test -f "${STAGE}/package.json" || { echo "Unexpected archive layout"; exit 1; }

          # 환경파일은 레포에 없는 운영 자산이다. 반드시 옮겨 심는다.
          cp -a "${APP}/${ENV_REL}" "${STAGE}/${ENV_REL}"

          echo "--- backing up to ${BACKUP} ---"
          mkdir -p "${BACKUP%/*}"
          cp -a "${APP}" "${BACKUP}"

          echo "--- swapping artifact ---"
          find "${APP}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${STAGE}/." "${APP}/"

          cd "${APP}"
          compose config >/dev/null || { echo "compose config failed"; exit 1; }

          echo "--- build & start (notion-cron only) ---"
          compose up -d --build notion-cron

          echo "--- health ---"
          ok=no
          for i in $(seq 1 36); do
            sleep 5
            code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 "${HEALTH_URL}" || true)"
            echo "  attempt ${i}: ${code:-no-response}"
            [ "${code}" = "200" ] && { ok=yes; break; }
          done

          if [ "${ok}" != "yes" ]; then
            echo "!!! health failed — restoring ${BACKUP}"
            find "${APP}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "${BACKUP}/." "${APP}/"
            cd "${APP}"
            compose up -d --build notion-cron || true
            exit 1
          fi

          echo "DEPLOYED_REF=${REF}"
          echo "BACKUP_AT=${BACKUP}"
          curl -fsS --max-time 10 "${HEALTH_URL}"; echo
          compose ps
          REMOTE

      - name: Clean up key
        if: always()
        shell: bash
        run: rm -f "${HOME}/.ssh/notion_cron_deploy_key"
